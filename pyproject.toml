[project]
name = "LIDS"
version = "0.1.0"
description = "Information-Dense Synthesis for Molecular Discovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.0.0",
    "botorch>=0.18.1",
    "colorcet>=3.1.0",
    "einops>=0.8.2",
    "einsum>=0.3.0",
    "graphviz>=0.21",
    "hydra-core>=1.3.2",
    "jax[cuda13]>=0.9.2",
    "lock-gp",
    "logomaker>=0.8.7",
    "numpy>=2.4.2",
    "numpyro>=0.20.1",
    "optax>=0.2.8",
    "seaborn>=0.13.2",
    "torch==2.10.0",
    "transformers==4.16.2",
    "umap-learn>=0.5.11",
    "wandb>=0.25.0",
]

[tool.uv.workspace]
members = [
    "lock_gp",
]

[tool.uv.config-settings-package]
lock-gp = { editable_mode = "compat" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
lock-gp = { workspace = true, editable = true }
torch = { index = "pytorch-cu130" }
